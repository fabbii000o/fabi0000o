<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusantara Mega Scholar: The Ultimate High School Quest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           CSS VARIABLES & RESET
           ============================================ */
        :root {
            --primary: #6C63FF;
            --primary-dark: #5A52D5;
            --secondary: #FF6584;
            --accent: #00D2FF;
            --success: #00C853;
            --warning: #FF9800;
            --danger: #F44336;
            --bg-dark: #0f0c29;
            --bg-mid: #302b63;
            --bg-light: #24243e;
            --text-light: #ffffff;
            --text-muted: #b0b0c0;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --difficulty-easy: #00C853;
            --difficulty-medium: #FF9800;
            --difficulty-hard: #F44336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-mid), var(--bg-light));
            min-height: 100vh;
            color: var(--text-light);
            overflow-x: hidden;
            position: relative;
        }

        /* Background animated particles */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(108, 99, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 101, 132, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(0, 210, 255, 0.1) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        /* ============================================
           LAYOUT & CONTAINERS
           ============================================ */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .screen.active {
            display: block;
        }

        /* ============================================
           ANIMATIONS
           ============================================ */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        @keyframes flashGreen {
            0% { box-shadow: 0 0 0 0 rgba(0, 200, 83, 0.7); }
            50% { box-shadow: 0 0 30px 10px rgba(0, 200, 83, 0.5); }
            100% { box-shadow: 0 0 0 0 rgba(0, 200, 83, 0); }
        }

        @keyframes flashRed {
            0% { background-color: rgba(244, 67, 54, 0.3); }
            100% { background-color: transparent; }
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        @keyframes celebrateBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes timerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes slideInRight {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .shake-anim {
            animation: shake 0.5s ease;
        }

        .flash-green {
            animation: flashGreen 0.6s ease;
        }

        .flash-red {
            animation: flashRed 0.4s ease;
        }

        .celebrate-text {
            animation: celebrateBlink 0.5s ease infinite;
        }

        /* ============================================
           MAIN MENU SCREEN
           ============================================ */
        .main-menu {
            text-align: center;
            padding-top: 40px;
        }

        .game-logo {
            margin-bottom: 10px;
        }

        .game-logo h1 {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            margin-bottom: 5px;
        }

        .game-logo .subtitle {
            font-size: clamp(0.8rem, 2.5vw, 1.1rem);
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .mascot-container {
            margin: 20px auto;
            animation: float 3s ease-in-out infinite;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 30px;
            padding: 0 10px;
        }

        @media (max-width: 480px) {
            .category-grid {
                grid-template-columns: 1fr;
            }
        }

        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 24px 16px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .category-card.ipa::before { background: linear-gradient(90deg, #00C853, #69F0AE); }
        .category-card.ips::before { background: linear-gradient(90deg, #FF9800, #FFB74D); }
        .category-card.bindo::before { background: linear-gradient(90deg, #2196F3, #64B5F6); }
        .category-card.math::before { background: linear-gradient(90deg, #9C27B0, #CE93D8); }

        .category-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .category-card:active {
            transform: translateY(-2px) scale(0.98);
        }

        .category-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .category-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .category-card p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* ============================================
           GAME SCREEN
           ============================================ */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .game-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat-badge {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(10px);
        }

        .stat-badge .icon {
            font-size: 1rem;
        }

        .difficulty-indicator {
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
        }

        .difficulty-indicator.easy {
            background: rgba(0, 200, 83, 0.2);
            color: var(--difficulty-easy);
            border: 1px solid rgba(0, 200, 83, 0.3);
        }

        .difficulty-indicator.medium {
            background: rgba(255, 152, 0, 0.2);
            color: var(--difficulty-medium);
            border: 1px solid rgba(255, 152, 0, 0.3);
        }

        .difficulty-indicator.hard {
            background: rgba(244, 67, 54, 0.2);
            color: var(--difficulty-hard);
            border: 1px solid rgba(244, 67, 54, 0.3);
            animation: pulse 1s ease infinite;
        }

        /* Timer bar */
        .timer-container {
            margin-bottom: 20px;
        }

        .timer-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .timer-bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.1s linear, background-color 0.3s ease;
            background: var(--success);
        }

        .timer-bar-fill.warning {
            background: var(--warning);
        }

        .timer-bar-fill.danger {
            background: var(--danger);
            animation: timerPulse 0.5s ease infinite;
        }

        .timer-text {
            text-align: center;
            margin-top: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Question card */
        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 28px 24px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            animation: slideInRight 0.4s ease;
        }

        .question-category-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            background: rgba(108, 99, 255, 0.2);
            color: var(--primary);
            border: 1px solid rgba(108, 99, 255, 0.3);
        }

        .question-text {
            font-size: clamp(1rem, 3vw, 1.2rem);
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .question-math {
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            font-weight: 700;
            color: var(--accent);
            text-align: center;
            padding: 16px;
            background: rgba(0, 210, 255, 0.08);
            border-radius: var(--radius-sm);
            margin: 12px 0;
            font-family: 'Courier New', monospace;
        }

        /* Answer options */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 480px) {
            .answers-grid {
                grid-template-columns: 1fr;
            }
        }

        .answer-btn {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            color: var(--text-light);
            font-family: 'Poppins', sans-serif;
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .answer-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: rgba(108, 99, 255, 0.15);
            transform: translateY(-2px);
        }

        .answer-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .answer-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .answer-btn.correct {
            border-color: var(--success) !important;
            background: rgba(0, 200, 83, 0.2) !important;
            animation: flashGreen 0.6s ease;
        }

        .answer-btn.wrong {
            border-color: var(--danger) !important;
            background: rgba(244, 67, 54, 0.2) !important;
        }

        .answer-btn .option-label {
            display: inline-block;
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            font-weight: 700;
            font-size: 0.8rem;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .answer-btn.correct .option-label {
            background: var(--success);
        }

        .answer-btn.wrong .option-label {
            background: var(--danger);
        }

        /* Combo display */
        .combo-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: 900;
            color: var(--warning);
            text-shadow: 0 0 20px rgba(255, 152, 0, 0.5);
            pointer-events: none;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .combo-display.show {
            opacity: 1;
            animation: pulse 0.5s ease;
        }

        /* Celebration overlay */
        .celebration-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .celebration-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .celebration-content {
            text-align: center;
            padding: 40px;
        }

        .celebration-content h2 {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            background: linear-gradient(135deg, #FFD700, #FFA500, #FF6347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .celebration-content p {
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        /* Confetti */
        .confetti-container {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 150;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confettiFall 3s ease-in forwards;
        }

        /* ============================================
           GAME OVER SCREEN
           ============================================ */
        .game-over {
            text-align: center;
            padding-top: 40px;
        }

        .game-over h2 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 900;
            margin-bottom: 10px;
        }

        .final-score {
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
        }

        .badge-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .badge {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 12px 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .badge .badge-icon {
            font-size: 2rem;
            margin-bottom: 4px;
        }

        .badge .badge-name {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .badge.earned {
            border-color: var(--warning);
            background: rgba(255, 152, 0, 0.15);
        }

        .badge.earned .badge-name {
            color: var(--warning);
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 24px 0;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 16px;
            backdrop-filter: blur(10px);
        }

        .stat-card .stat-value {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .stat-card .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .btn-restart {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 50px;
            padding: 16px 40px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }

        .btn-restart:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(108, 99, 255, 0.4);
        }

        .btn-restart:active {
            transform: translateY(-1px);
        }

        /* Flash overlay for wrong answers */
        .flash-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        .flash-overlay.red {
            background: rgba(244, 67, 54, 0.2);
            opacity: 1;
        }

        /* ============================================
           UTILITY CLASSES
           ============================================ */
        .text-center { text-al
