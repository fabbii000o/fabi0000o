        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Screen Shake Animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
        .screen-shake { animation: shake 0.5s ease-in-out; }
        
        /* Green Flash for Correct */
        @keyframes greenFlash {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .correct-flash { animation: greenFlash 0.6s ease-out; }
        
        /* Red Flash for Wrong */
        @keyframes redFlash {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .wrong-flash { animation: redFlash 0.6s ease-out; }
        
        /* Confetti Particles */
        .confetti-piece {
            position: fixed;
            width: 12px;
            height: 12px;
            background: #f00;
            animation: confettiFall 3s ease-out forwards;
            z-index: 1000;
            pointer-events: none;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        
        /* Celebration Text */
        @keyframes blinkCelebrate {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        .celebrate-blink { animation: blinkCelebrate 0.6s ease-in-out 3; }
        
        /* Timer Pulse */
        @keyframes timerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .timer-pulse { animation: timerPulse 0.4s ease-in-out; }
        
        /* Card Hover Effects */
        .category-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .category-card:hover {
            transform: translateY(-8px) scale(1.02);
        }
        
        /* Smooth Transitions */
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

                        const b = Math.floor(Math.random() * 20) + 5;
                        return {
                            q: `Ibu membeli ${a} telur, lalu membeli lagi ${b} telur. Berapa total telur ibu?`,
                            a: a + b
                        };
                    }
                }
            ];

            const template = questionTemplates[Math.floor(Math.random() * questionTemplates.length)];
            const { q, a } = template.create();
            return this._buildMultipleChoice(q, a);
        },

        /**
         * Soal SEDANG: Perkalian, pembagian, campuran (tanpa kurung)
         * Basis angka 1-12, hasil selalu bilangan bulat
         */
        _generateMedium() {
            const templates = [
                // Perkalian dasar
                {
                    create: () => {
                        const a = Math.floor(Math.random() * 12) + 1;
                        const b = Math.floor(Math.random() * 12) + 1;
                        return { q: `${a} × ${b} = ?`, a: a * b };
                    }
                },
                // Pembagian (hasil bulat)
                {
                    create: () => {
                        const b = Math.floor(Math.random() * 11) + 2; // 2-12
                        const result = Math.floor(Math.random() * 12) + 1;
                        const a = b * result;
                        return { q: `${a} ÷ ${b} = ?`, a: result };
                    }
                },
                // Operasi campuran dua operasi
                {
                    create: () => {
                        const a = Math.floor(Math.random() * 20) + 10;
                        const b = Math.floor(Math.random() * 15) + 5;
                        const c = Math.floor(Math.random() * 10) + 1;
                        const result = a + b - c;
                        return { q: `${a} + ${b} - ${c} = ?`, a: result };
                    }
                },
                // Campuran perkalian dan penjumlahan
                {
                    create: () => {
                        const a = Math.floor(Math.random() * 10) + 2;
                        const b = Math.floor(Math.random() * 10) + 2;
                        const c = Math.floor(Math.random() * 20) + 5;
                        const result = a * b + c;
                        return { q: `${a} × ${b} + ${c} = ?`, a: result };
                    }
                }
            ];

            const template = templates[Math.floor(Math.random() * templates.length)];
            const { q, a } = template.create();
            return this._buildMultipleChoice(q, a);
        },

        /**
         * Soal SULIT: Tanda kurung, kuadrat/akar, persamaan linear 1 variabel
         */
        _generateHard() {
            const templates = [
                // Operasi dengan tanda kurung
                {
                    create: () => {
                        const a = Math.floor(Math.random() * 15) + 5;
                        const b = Math.floor(Math.random() * 10) + 1;
                        const c = Math.floor(Math.random() * 8) + 2;
                        const result = (a - b) * c;
                        return { q: `(${a} - ${b}) × ${c} = ?`, a: result };
                    }
                },
                // Kuadrat sederhana
                {
                    create: () => {
                        const a = Math.floor(Math.random() * 12) + 2; // 2-13
                        const b = Math.floor(Math.random() * 50) + 10;
                        const result = a * a - b;
                        return { q: `${a}² - ${b} = ?`, a: result };
                    }
                },
                // Akar sederhana
                {
                    create: () => {
                        const result = Math.floor(Math.random() * 10) + 2; // 2-11
                        const perfectSquare = result * result;
                        const b = Math.floor(Math.random() * 20) + 1;
                        return { q: `√${perfectSquare} + ${b} = ?`, a: result + b };
                    }
                },
                // Persamaan linear 1 variabel: ax = b
                {
                    create: () => {
                        const a = Math.floor(Math.random() * 10) + 2; // 2-11
                        const x = Math.floor(Math.random() * 12) + 1; // 1-12
                        const b = a * x;
                        return { q: `${a}x = ${b}. Berapakah nilai x?`, a: x };
                    }
                },
                // Kombinasi kuadrat dan operasi lain
                {
                    create: () => {
                        const a = Math.floor(Math.random() * 8) + 3;
                        const b = Math.floor(Math.random() * 5) + 2;
                        const result = a * a + b * b;
                        return { q: `${a}² + ${b}² = ?`, a: result };
                    }
                }
            ];

            const template = templates[Math.floor(Math.random() * templates.length)];
            const { q, a } = template.create();
            return this._buildMultipleChoice(q, a);
        },

        /**
         * Fungsi pembantu untuk membuat pilihan ganda
         * Membuat 1 jawaban benar + 3 kecohan yang masuk akal
         */
        _buildMultipleChoice(question, correctAnswer) {
            const options = [correctAnswer];
            
            // Generate 3 jawaban salah yang masuk akal (berdekatan dengan jawaban benar)
            while (options.length < 4) {
                let wrong;
                const offset = Math.floor(Math.random() * 10) + 1;
                
                // Variasi kecohan: jawaban benar ± offset, atau hasil operasi salah
                if (Math.random() > 0.5) {
                    wrong = correctAnswer + offset;
                } else {
                    wrong = correctAnswer - offset;
                }
                
                // Pastikan kecohan tidak sama dengan jawaban benar atau kecohan lain
                if (wrong !== correctAnswer && !options.includes(wrong) && wrong >= 0) {
                    options.push(wrong);
                }
            }
            
            // Acak urutan pilihan
            const shuffledOptions = this._shuffleArray(options);
            
            return {
                q: question,
                a: correctAnswer.toString(),
                options: shuffledOptions.map(opt => opt.toString()),
                isMath: true
            };
        },

        /**
         * Fungsi Fisher-Yates shuffle untuk mengacak array
         */
        _shuffleArray(arr) {
            const shuffled = [...arr];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
    };

    // 4. GAME ENGINE - Logika gameplay utama
    // ==========================================
    const GameEngine = {
        /**
         * Inisialisasi game baru
         */
        startGame(category) {
            GameState.currentScreen = 'game';
            GameState.selectedCategory = category;
            GameState.score = 0;
            GameState.lives = 3;
            GameState.combo = 0;
            GameState.maxCombo = 0;
            GameState.currentDifficulty = 'MUDAH';
            GameState.questionIndex = 0;
            GameState.usedQuestions = new Set();
            GameState.isAnswering = false;
            GameState.badge = null;

            this.loadNextQuestion();
        },

        /**
         * Memuat soal berikutnya berdasarkan kategori dan kesulitan saat ini
         */
        loadNextQuestion() {
            const category = GameState.selectedCategory;
            const difficulty = this.getDifficulty();
            
            // Update difficulty state
            GameState.currentDifficulty = difficulty;
            
            let question;
            
            // Untuk Matematika, gunakan generator
            if (category === 'MATEMATIKA') {
                question = MathGenerator.generate(difficulty);
            } else {
                // Untuk IPA/IPS/Bahasa, ambil dari bank soal
                const bank = QuestionBank[category][difficulty];
                
                // Reset used questions jika semua soal sudah terpakai
                if (GameState.usedQuestions.size >= bank.length) {
                    GameState.usedQuestions.clear();
                }
                
                // Pilih soal acak yang belum digunakan
                let availableIndices = [];
                for (let i = 0; i < bank.length; i++) {
                    if (!GameState.usedQuestions.has(i)) {
                        availableIndices.push(i);
                    }
                }
                
                const randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
                GameState.usedQuestions.add(randomIndex);
                
                // Clone soal untuk menghindari modifikasi
                question = { ...bank[randomIndex] };
            }
            
            GameState.currentQuestion = question;
            GameState.isAnswering = false;
            
            // Set timer berdasarkan kesulitan
            this.setTimerForDifficulty(difficulty);
        },

        /**
         * Menentukan tingkat kesulitan berdasarkan skor saat ini
         */
        getDifficulty() {
            const score = GameState.score;
            if (score > 120) return 'SULIT';
            if (score > 50) return 'SEDANG';
            return 'MUDAH';
        },

        /**
         * Set waktu timer berdasarkan tingkat kesulitan
         * MUDAH: 15s, SEDANG: 12s (Matematika 10s), SULIT: 8s (Matematika 7s)
         */
        setTimerForDifficulty(difficulty) {
            const category = GameState.selectedCategory;
            const isMath = category === 'MATEMATIKA';
            
            if (difficulty === 'MUDAH') {
                GameState.timer = 15;
            } else if (difficulty === 'SEDANG') {
                GameState.timer = isMath ? 10 : 12;
            } else {
                GameState.timer = isMath ? 7 : 8;
            }
            
            this.startTimer();
        },

        /**
         * Memulai countdown timer
         */
        startTimer() {
            if (GameState.timerInterval) clearInterval(GameState.timerInterval);
            
            GameState.timerInterval = setInterval(() => {
                GameState.timer--;
                
                // Update UI timer
                UIManager.updateTimerDisplay();
                
                // Waktu habis
                if (GameState.timer <= 0) {
                    clearInterval(GameState.timerInterval);
                    this.handleWrongAnswer(true); // true = timeout
                }
            }, 1000);
        },

        /**
         * Menangani jawaban benar
         * - Skor +10
         * - Bonus waktu sisa (+1 per detik)
         * - Combo streak naik
         * - Lanjut soal berikutnya
         */
        handleCorrectAnswer() {
            if (GameState.isAnswering) return;
            GameState.isAnswering = true;
            
            if (GameState.timerInterval) clearInterval(GameState.timerInterval);
            
            // Hitung poin: 10 poin dasar + bonus waktu sisa
            const timeBonus = Math.max(0, GameState.timer);
            const pointsEarned = 10 + timeBonus;
            GameState.score += pointsEarned;
            
            // Update combo
            GameState.combo++;
            if (GameState.combo > GameState.maxCombo) {
                GameState.maxCombo = GameState.combo;
            }
            
            // Efek visual benar
            UIManager.showCorrectEffect(pointsEarned);
            
            // Cek milestone sulit (>120)
            if (GameState.score > 120 && GameState.currentDifficulty !== 'SULIT') {
                setTimeout(() => {
                    UIManager.showCelebration();
                }, 500);
            }
            
            // Lanjut soal berikutnya setelah delay
            setTimeout(() => {
                this.loadNextQuestion();
                UIManager.renderGameScreen();
            }, 1200);
        },

        /**
         * Menangani jawaban salah / waktu habis
         * - Nyawa berkurang 1
         * - Combo reset ke 0
         * - Efek screen shake + flash merah
         */
        handleWrongAnswer(isTimeout = false) {
            if (GameState.isAnswering) return;
            GameState.isAnswering = true;
            
            if (GameState.timerInterval) clearInterval(GameState.timerInterval);
            
            GameState.lives--;
            GameState.combo = 0;
            
            // Efek visual salah
            UIManager.showWrongEffect(isTimeout ? 'Waktu Habis!' : 'Salah!');
            
            // Cek game over
            if (GameState.lives <= 0) {
                setTimeout(() => {
                    this.endGame();
                }, 1500);
            } else {
                // Lanjut soal berikutnya
                setTimeout(() => {
                    this.loadNextQuestion();
                    UIManager.renderGameScreen();
                }, 1500);
            }
        },

        /**
         * Mengakhiri game dan menampilkan layar Game Over
         */
        endGame() {
            GameState.currentScreen = 'gameover';
            
            // Tentukan badge berdasarkan skor
            if (GameState.score >= 200) {
                GameState.badge = { name: '🏆 Mega Scholar', tier: 'gold', desc: 'Luar Biasa! Kamu menguasai materi dengan sempurna!' };
            } else if (GameState.score >= 150) {
                GameState.badge = { name: '🥇 Scholar Elite', tier: 'silver', desc: 'Hebat! Pengetahuanmu sangat luas!' };
            } else if (GameState.score >= 80) {
                GameState.badge = { name: '🥈 Scholar Pro', tier: 'bronze', desc: 'Bagus! Terus tingkatkan belajarmu!' };
            } else {
                GameState.badge = { name: '📚 Scholar Pemula', tier: 'bronze', desc: 'Jangan menyerah! Terus belajar ya!' };
            }
            
            UIManager.renderGameOverScreen();
        },

        /**
         * Restart game
         */
        restartGame() {
            this.startGame(GameState.selectedCategory);
        }
    };

         * Tampilkan teks melayang (floating text)
         */
        showFloatingText(text, colorClass) {
            const floatEl = document.createElement('div');
            floatEl.className = `fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-2xl font-bold ${colorClass} z-50 pointer-events-none`;
            floatEl.textContent = text;
            floatEl.style.animation = 'fadeIn 0.3s ease-out';
            document.body.appendChild(floatEl);
            
            setTimeout(() => {
                floatEl.style.transition = 'all 0.8s ease-out';
                floatEl.style.transform = 'translate(-50%, -150%)';
                floatEl.style.opacity = '0';
                setTimeout(() => floatEl.remove(), 800);
            }, 200);
        },

        /**
         * Animasi confetti untuk milestone sulit
         */
        showCelebration() {
            const colors = ['#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti-piece';
                    confetti.style.left = `${Math.random() * 100}vw`;
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    confetti.style.width = `${Math.random() * 10 + 6}px`;
                    confetti.style.height = `${Math.random() * 10 + 6}px`;
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }

            // Tampilkan teks selebrasi
            const celebEl = document.createElement('div');
            celebEl.className = 'fixed inset-0 flex items-center justify-center z-40 pointer-events-none';
            celebEl.innerHTML = `
                <div class="celebrate-blink bg-gradient-to-r from-yellow-400 via-pink-500 to-purple-500 px-8 py-4 rounded-2xl shadow-2xl text-center">
                    <div class="text-3xl md:text-4xl font-extrabold text-white">
                        🎉 LUAR BIASA! 🎉<br>
                        <span class="text-xl md:text-2xl">KAMU MAKIN PINTAR!</span>
                    </div>
                </div>
            `;
            document.body.appendChild(celebEl);
            
            setTimeout(() => celebEl.remove(), 2500);
        },
